name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快的部分：型別、lint、單元與整體檢查（vitest 的 light project）。
  # 逐張牌的契約與 AI 統計檢查（heavy project）會隨牌數變慢，拆到下面的 ai-stats 並行跑。
  # 本機的 `npm run check` 仍然包含全部測試（light ＋ heavy）；CI 這兩個 job 加起來等於它。
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run test:light

  # heavy project 的所有測試檔（逐張牌的契約檢查 K1–K13、R1–R3，A1–A5 統計檢查，每張牌的 measure.test.ts……）
  # 分成 6 份、每份一台機器並行跑。
  # --shard 的切法（vitest 5.0.3，BaseSequencer.shard）：把檔案路徑（相對於專案根目錄、開頭有斜線，例如
  # `/src/games/C-Q/measure.test.ts`）取 sha1，依雜湊值排序，再依檔案「個數」等分切片（47 個檔案、6 份 → 8、8、8、8、8、7）。
  # **完全不看耗時**，所以每份拿到的檔案多慢是運氣；檔案的增減會讓所有檔案重新洗牌（某張牌的檔案可能換到另一份）。
  # tests/ai/a-checks.shared.ts 的 SLOT_COUNT（13 份）只是把 A1–A5 與契約檢查依牌的序號拆成 13 個檔案，
  # 讓單一檔案不至於太大，與 --shard 怎麼切無關。
  # 一份的牆鐘時間 ≈ 它拿到的最慢那個檔案（同一份裡的檔案由 vitest 的 worker 並行跑），所以要讓分片平均，
  # 重點是不要有單一檔案遠比別的慢（measure.test.ts 的慣例見 S-K 的 measure.test.ts：
  # 預設場數縮小、大場次用環境變數開）。要加快就把 shard 清單加長（例如 [1, …, 8]）並把 --shard 的分母改成同一個數字。
  ai-stats:
    name: ai-stats (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx vitest run --project heavy --shard=${{ matrix.shard }}/6

  # 時間類測試（A5 的 p99.9 與平均、K11 一場對局的時間、幾條「少於 1 秒」的單元測試）：
  # 序列跑、獨佔一台機器，不與 check／ai-stats 的測試擠在同一台。這些測試量牆鐘時間，
  # 與別的測試並行就會假性變紅（10.41）。門檻沒動，也沒有跳過；跑法見 TEST_PLAN 第 10 節。
  timing:
    name: timing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: uptime

      - run: npm run test:timing

  # 端到端測試（TEST_PLAN 第 7 節）。和 check 並行跑、各自回報，不互相等；
  # 失敗的時候看 check 是不是也紅了就知道是外殼還是核心的問題。
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # DEBUG=pw:webserver 讓 Playwright 印出 dev server 的輸出，逾時時才看得到原因。
      - run: npm run e2e
        env:
          DEBUG: pw:webserver

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # 部署到 GitHub Pages（TASKS T5）。只在 main 分支的 push 才跑，而且要 check、ai-stats、timing 與 e2e 都成功。
  # repo 設定要先手動把 Settings → Pages → Build and deployment → Source 選成 GitHub Actions。
  deploy:
    name: deploy
    needs: [check, ai-stats, timing, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # 部署不要被新的 push 取消到一半；同時只留一個。
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
